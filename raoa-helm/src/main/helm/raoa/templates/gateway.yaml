{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "raoa.fullname" . }}
  labels:
    {{- include "raoa.labels" . | nindent 4 }}
  {{- with .Values.gateway.httproute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  hostnames:
    {{- toYaml .Values.gateway.hostnames | nindent 4}}
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4}}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "raoa.fullname" . }}-viewer
          port: {{ .Values.containerPort }}
          weight: 1

{{- end }}
